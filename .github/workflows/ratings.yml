name: NiKo ratings backfill

# 自动回补 NiKo 每场 Rating 2.1（HLTV 数据源，需真实浏览器突破 Cloudflare）。
#
# 背景：评分来自 HLTV mapstats 页，Cloudflare 挑战直连必 403，必须走
# Scrapling StealthyFetcher（无头 Chromium 解 Turnstile）。本机沙箱/贫配机
# 没有浏览器，所以放 GitHub Actions（ubuntu-latest 可装 chromium）跑。
#
# 流程：fetch_ratings.py 抓取缺失场次的逐图评分写入 ratings.json
#       → fetch_ratings.py --merge 合并进 data.json
#       → 提交推送（与 update.yml 同 concurrency 组，串行避免抢分支）
#       → 清 jsDelivr 缓存。
#
# 线上页面每 60 秒轮询 /gh/data.json；data.json 一旦含新评分，
# 前端 dataFingerprint 变化即自动重画对应模块 —— 评分「抓取即显示」，无需手动重建。
on:
  schedule:
    - cron: "13 */2 * * *"      # 每 2 小时回补一次（评分只在比赛结束后才有，2h 足够实时）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niko-data              # 与 update.yml 共用，序列化推送，避免两边都改 data.json 抢远端
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Scrapling + Playwright（突破 HLTV Cloudflare 用）
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          # 注意：scrapling 不提供 [playwright] 这个 extra，必须分开装。
          # StealthyFetcher 只需 import 得到 playwright 包即可。
          pip install scrapling playwright
          python -m playwright install chromium
          # 系统级依赖（无头 Chromium 运行所需）；失败不阻断主流程
          sudo python -m playwright install-deps chromium || true
          python -c "import scrapling, playwright; print('scrapling', scrapling.__version__, '| playwright ok')"

      - name: 回补缺失评分
        continue-on-error: true
        timeout-minutes: 50
        run: |
          python fetch_ratings.py
          echo "--- 覆盖率 ---"
          python fetch_ratings.py --report

      - name: 合并进 data.json
        continue-on-error: true
        run: python fetch_ratings.py --merge

      - name: Commit & push
        id: commit
        run: |
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add data.json ratings.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: backfill NiKo ratings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ok=0
            for i in 1 2 3 4 5; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then echo "push 失败（已重试 5 次）"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in data.json ratings.json; do
            curl -s "https://purge.jsdelivr.net/gh/xiaohuya520wy/niko@main/$f"
            echo " purged $f"
          done
